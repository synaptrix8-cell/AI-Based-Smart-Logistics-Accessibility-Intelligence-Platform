# Setu — Local Development Environment
# docker-compose up -d
# This runs the FastAPI risk engine with hot-reload.
# Supabase is hosted (not local) — configure via .env

version: "3.8"

services:
  risk-engine:
    build:
      context: ../services/risk-engine
      dockerfile: Dockerfile
    container_name: setu-risk-engine
    ports:
      - "8000:8000"
    env_file:
      - ../services/risk-engine/.env
    volumes:
      - ../services/risk-engine:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
