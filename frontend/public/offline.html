<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setu - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #064E3B 0%, #0F172A 40%, #1E293B 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 480px; }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.9375rem; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 1.5rem; }
    .note {
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 1.5rem;
    }
    .note strong { color: #F59E0B; }
    button {
      background: #0A6847;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #16A34A; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      No internet connection detected. Your reports are saved locally
      and will be synced automatically when you reconnect.
    </p>
    <div class="note">
      <strong>SMS Fallback:</strong> Text your report to our USSD gateway:<br>
      <code>BLOCKED [road] [KM marker]</code><br>
      Example: <code>BLOCKED NH6 KM42</code>
    </div>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
